name: sms_app
description: "School Management System App"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  webview_windows: ^0.4.0
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  path_provider: ^2.1.6
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

flutter_launcher_icons:
  image_path: "assets/logo.jpg"
  windows:
    generate: true
    image_path: "assets/logo.jpg"
  android: false
  ios: false
